plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.stlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.stlauncher'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
