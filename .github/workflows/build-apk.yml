name: Build Android APK (SDK bypass fix)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu already includes the Android SDK and sdkmanager.
      # Avoid android-actions/setup-android entirely because old releases try
      # to install Google's removed, deprecated SDK package called "tools".
      - name: Install Android SDK 35 (no deprecated tools)
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK bypass workflow: Android SDK 35"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo 'Android SDK root is missing on this runner.' >&2
            exit 1
          fi
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo 'sdkmanager is not available on this runner.' >&2
            exit 1
          fi
          "$sdkmanager_bin" --version
          "$sdkmanager_bin" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check reply events JavaScript
        run: |
          node --check app/src/main/assets/reply_events.js
          node --check app/src/main/assets/blob_export.js
          node tests/reply-events-smoke.js

      - name: Check bound-URL handling
        run: |
          mkdir -p build/smoke-tests
          javac -d build/smoke-tests app/src/main/java/io/github/stlauncher/BoundUrl.java tests/BoundUrlSmoke.java
          java -cp build/smoke-tests io.github.stlauncher.BoundUrlSmoke

      - name: Compile installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavernLauncher-v0.2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
