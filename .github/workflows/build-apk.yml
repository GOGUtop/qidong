name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check reply events JavaScript
        run: node --check app/src/main/assets/reply_events.js && node --check app/src/main/assets/blob_export.js && node tests/reply-events-smoke.js

      - name: Check bound-URL handling
        run: |
          mkdir -p build/smoke-tests
          javac -d build/smoke-tests app/src/main/java/io/github/stlauncher/BoundUrl.java tests/BoundUrlSmoke.java
          java -cp build/smoke-tests io.github.stlauncher.BoundUrlSmoke

      - name: Compile installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavernLauncher-v0.2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
